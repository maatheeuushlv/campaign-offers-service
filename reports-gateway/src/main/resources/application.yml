server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 300

spring:
  application:
    name: reports-gateway
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/reportsdb}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

lab:
  dev-endpoints: ${DEV_ENDPOINTS:true}
  reports-service-url: ${REPORTS_SERVICE_URL:http://localhost:8081}
  campaign-service-url: ${CAMPAIGN_SERVICE_URL:http://localhost:8082}
  jwt:
    secret: ${JWT_SECRET:lab-secret-lab-secret-lab-secret-123456}
    cnpj-claim: ${JWT_CNPJ_CLAIM:cnpj}
  zone: ${APP_ZONE:America/Sao_Paulo}
  cache:
    ttl-hours: ${CACHE_TTL_HOURS:12}
  fix:
    atomic-write: ${FIX_ATOMIC_WRITE:false}
    invalidate-after-commit: ${FIX_INVALIDATE_AFTER_COMMIT:false}
    versioned-cache: ${FIX_VERSIONED_CACHE:false}
    lock: ${FIX_LOCK:false}
  sim:
    write-delay-ms: ${SIM_WRITE_DELAY_MS:0}
    load-delay-ms: ${SIM_LOAD_DELAY_MS:0}
